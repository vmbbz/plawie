<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clawa VRM</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0 auto;
        }
    </style>
    <script>
        // esmsInitOptions MUST be set before es-module-shims loads.
        window.esmsInitOptions = { shimMode: true };
    </script>
    <script src="./lib/es-module-shims.js"></script>
    <script type="importmap-shim">
    {
        "imports": {
            "three": "./lib/three.module.js",
            "three/addons/": "./lib/",
            "@pixiv/three-vrm": "./lib/three-vrm.module.js",
            "@pixiv/three-vrm-animation": "./lib/three-vrm-animation.module.js"
        }
    }
    </script>
</head>

<body>
    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const errorMsg = 'ERROR: ' + msg + ' @ ' + url + ':' + lineNo + ':' + columnNo;
            console.error(errorMsg);
            if (window.PlawieBridge) {
                window.PlawieBridge.postMessage(errorMsg);
            }
            return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
            const msg = 'ERROR (Promise): ' + (event.reason ? event.reason.toString() : 'Unknown rejection');
            console.error(msg);
            if (window.PlawieBridge) {
                window.PlawieBridge.postMessage(msg);
            }
        });

        (function () {
            const probe = () => {
                if (window.PlawieBridge) {
                    window.PlawieBridge.postMessage('LOG: [JS] Bridge Probe Successful');
                } else {
                    setTimeout(probe, 100);
                }
            };
            probe();
        })();
    </script>
    <script type="module-shim">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { createVRMAnimationClip, VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';

        const IS_MOBILE_RENDERER = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const MAX_RENDER_PIXEL_RATIO = IS_MOBILE_RENDERER ? 0.65 : 1.5;
        const TARGET_FRAME_MS = IS_MOBILE_RENDERER ? 1000 / 30 : 1000 / 60;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(0.0, 1.45, 1.5);
        camera.lookAt(0, 1.3, 0);

        const renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: !IS_MOBILE_RENDERER,
            powerPreference: IS_MOBILE_RENDERER ? "default" : "high-performance"
        });
        renderer.setPixelRatio(MAX_RENDER_PIXEL_RATIO);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const simpleLight = new THREE.DirectionalLight(0xffffff, 0.3);
        simpleLight.position.set(1.0, 2.0, 3.0);
        scene.add(simpleLight);

        let currentVrm = null;
        let mixer = null;
        let idleAction = null;
        let currentAction = null;
        let renderPaused = document.hidden;
        let rendererDisposed = false;
        let lastRenderAt = 0;

        const gestures = {};
        const GESTURE_PATHS = [
            'dance_picatrix', 'gesture_cute', 'gesture_dance', 'gesture_elegant',
            'gesture_fight', 'gesture_greeting', 'gesture_peacesign', 'gesture_pose',
            'gesture_powerful', 'gesture_ready', 'gesture_shoot', 'gesture_spin',
            'gesture_squat', 'gesture_talk'
        ];
        const LIMB_GESTURE_PATHS = {
            'wave': 'animations/limbs/Wave_Right_01.vrma',
            'wave right': 'animations/limbs/Wave_Right_01.vrma',
            'wave left': 'animations/limbs/Wave_Left_01.vrma',
            'both wave': 'animations/limbs/Wave_Both_01.vrma',
            'cheerful wave left': 'animations/limbs/Cheerful_Wave_Left_01.vrma',
            'cheerful wave right': 'animations/limbs/Cheerful_Wave_Right_01.vrma',
            'excited wave left': 'animations/limbs/Excited_Wave_Left_01.vrma',
            'excited wave right': 'animations/limbs/Excited_Wave_Right_01.vrma',
            'bow': 'animations/limbs/Bowing_01.vrma',
            'bowing': 'animations/limbs/Bowing_01.vrma',
            'sitting wave': 'animations/limbs/Sitting_Both_Wave_01.vrma',
            'exaggerated wave': 'animations/limbs/Exaggerated_Wave_Both_01.vrma',
            'stylized wave': 'animations/limbs/Stylized_Wave_Left_01.vrma',
            'fearful wave': 'animations/limbs/Fearful_Wave_01.vrma',
        };
        const GESTURE_FILE_MAP = {};
        GESTURE_PATHS.forEach(name => {
            const path = `animations/${name}.vrma`;
            GESTURE_FILE_MAP[name] = path;
            if (name.startsWith('gesture_')) {
                GESTURE_FILE_MAP[name.replace('gesture_', '')] = path;
            } else if (name === 'dance_picatrix') {
                GESTURE_FILE_MAP['dance'] = path;
            }
        });
        Object.entries(LIMB_GESTURE_PATHS).forEach(([alias, path]) => {
            GESTURE_FILE_MAP[alias] = path;
            GESTURE_FILE_MAP[path.toLowerCase()] = path;
            GESTURE_FILE_MAP[path.split('/').pop().replace('.vrma', '').toLowerCase().replaceAll('_', ' ')] = path;
        });
        const pendingGestureLoads = {};
        let currentAnimationLoader = null;

        let neonStool = null;
        let stoolSeat, stoolLegs = [];

        function createNeonStool() {
            // Seat (thick glowing disk)
            const seatGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 32);
            const seatMat = new THREE.MeshPhongMaterial({
                color: 0x112233,
                emissive: 0x00FFFF,      // neon cyan
                emissiveIntensity: 1.2,
                shininess: 100,
                transparent: true,
                opacity: 0.95
            });
            stoolSeat = new THREE.Mesh(seatGeo, seatMat);
            stoolSeat.rotation.x = Math.PI / 2; // make it flat

            // Visible neon edges (glowing outline)
            const edgesGeo = new THREE.EdgesGeometry(seatGeo);
            const edgesMat = new THREE.LineBasicMaterial({
                color: 0xFF00FF,         // hot magenta edges
                linewidth: 4
            });
            const edges = new THREE.LineSegments(edgesGeo, edgesMat);
            stoolSeat.add(edges);

            // 4 thin glowing legs
            const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.45, 16);
            const legMat = new THREE.MeshPhongMaterial({
                emissive: 0x00FFFF,
                emissiveIntensity: 0.8
            });

            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(
                    Math.cos(i * Math.PI / 2) * 0.25,
                    -0.25,
                    Math.sin(i * Math.PI / 2) * 0.25
                );
                stoolSeat.add(leg);
                stoolLegs.push(leg);
            }

            neonStool = stoolSeat;
            neonStool.visible = false;
            scene.add(neonStool);
        }

        // ── Animation State Machine ───────────────────────────────────────────
        // proceduralBlend: 1.0 = full idle procedural, 0.05 = suppressed during VRMA.
        // When a VRMA clip is active the procedural bone overrides are scaled down so
        // they don't fight the VRMA keyframes — this is the root cause of "jumping".
        let proceduralBlend = 1.0;

        // talkGestureActive: true when gesture_talk is auto-playing during TTS.
        let talkGestureActive = false;

        // gestureMode: controlled by the agent via setGestureMode().
        // 'normal'      — auto-talk during TTS, no random interjections
        // 'expressive'  — random gestures interspersed during long TTS
        // 'dance'       — dance loop while speaking
        // 'subtle'      — no auto-gesture during TTS, minimal procedural
        let gestureMode = 'normal';
        let nextRandomGestureTime = -1;
        const EXPRESSIVE_GESTURES = ['cute', 'elegant', 'peacesign', 'pose', 'powerful', 'spin'];

        let speechIntensity = 0.0;
        let isSpeaking = false;
        let isThinking = false;
        let targetEmotion = 'neutral';
        let lastHeadSync = 0;

        // ── Viseme engine state (world-class syllable-rhythm driver) ──────────
        // Replaces the old 8 Hz round-robin. Each "syllable slot" picks a
        // phoneme weighted by English vowel frequency, then applies a rise/hold/
        // close envelope. Produces natural co-articulation without audio analysis.
        const VISEMES = ['aa', 'ih', 'ee', 'oh', 'ou'];
        // Weighted phoneme pool — English vowel frequency ordering
        const PHONEME_POOL = [
            ['aa', 0.30], ['oh', 0.22], ['ih', 0.20], ['ee', 0.15], ['ou', 0.13],
        ];
        let syllableTimer = 0.0;      // time within current syllable
        let syllableDur = 0.18;       // base syllable duration (180 ms ≈ 5.5 syl/s)
        let activeViseme = 'aa';      // current target viseme
        let syllableAmp = 0.85;       // per-syllable amplitude variation

        function pickViseme(available) {
            const valid = PHONEME_POOL.filter(([v]) => available.includes(v));
            if (!valid.length) return available[0] || 'aa';
            const total = valid.reduce((s, [, w]) => s + w, 0);
            let r = Math.random() * total;
            for (const [v, w] of valid) { r -= w; if (r <= 0) return v; }
            return valid[0][0];
        }

        let targetCameraZ = 1.6;
        let currentCameraZ = 1.6;

        function disposeCurrentAvatar() {
            if (mixer) {
                try { mixer.stopAllAction(); } catch (_) {}
                mixer = null;
            }
            currentAnimationLoader = null;
            idleAction = null;
            currentAction = null;
            talkGestureActive = false;
            for (const key of Object.keys(gestures)) delete gestures[key];
            for (const key of Object.keys(pendingGestureLoads)) delete pendingGestureLoads[key];

            if (currentVrm) {
                try {
                    scene.remove(currentVrm.scene);
                    currentVrm.dispose();
                } catch (e) {
                    console.warn('Avatar dispose failed', e);
                }
                currentVrm = null;
            }
        }

        window.loadVrmAvatar = (avatarFileName) => {
            if (window.PlawieBridge) window.PlawieBridge.postMessage('LOG: [JS] Starting load of ' + avatarFileName);

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

            loader.load('./' + avatarFileName,
                (gltf) => {
                    if (window.PlawieBridge) window.PlawieBridge.postMessage('LOG: [JS] ' + avatarFileName + ' loaded successfully');

                    disposeCurrentAvatar();

                    // Reset animation state on model change
                    talkGestureActive = false;
                    proceduralBlend = 1.0;

                    const vrm = gltf.userData.vrm;
                    scene.add(vrm.scene);
                    currentVrm = vrm;
                    vrm.scene.rotation.y = Math.PI;
                    vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
                    vrm.scene.position.set(0, 0, 0);
                    vrm.scene.updateMatrixWorld(true);

                    const box = new THREE.Box3().setFromObject(vrm.scene);
                    const size = box.getSize(new THREE.Vector3());
                    
                    // Normalize height: Scale model so it is roughly 1.8 units tall (to top of box)
                    // This ensures Germini and Boruto have the same visual weight.
                    const targetHeight = 1.6;
                    const scaleFactor = targetHeight / size.y;
                    vrm.scene.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    vrm.scene.updateMatrixWorld(true);

                    // Re-measure after scaling
                    const newBox = new THREE.Box3().setFromObject(vrm.scene);
                    const newSize = newBox.getSize(new THREE.Vector3());
                    const head = vrm.humanoid.getNormalizedBoneNode('head');
                    const headPos = new THREE.Vector3();
                    if (head) head.getWorldPosition(headPos);

                    avatarMetrics = {
                        height: newSize.y,
                        width: newSize.x,
                        centerX: 0.0, // Face camera straight
                        headY: head ? headPos.y : 1.6,
                    };

                    if (vrm.expressionManager) {
                        const exprNames = Object.keys(vrm.expressionManager.expressionMap);
                        const hasVisemes = ['aa','ih','ee','oh','ou'].some(v => exprNames.includes(v));
                        const hasMouthOpen = exprNames.includes('mouthOpen');
                        const mouthLog = hasVisemes
                            ? 'VRM mouth: visemes (' + VISEMES.filter(v => exprNames.includes(v)).join(',') + ')'
                            : hasMouthOpen ? 'VRM mouth: mouthOpen only (no visemes)'
                            : 'VRM mouth: WARN — no visemes or mouthOpen';
                        if (window.PlawieBridge) window.PlawieBridge.postMessage('LOG: [JS] ' + mouthLog);
                    }

                    updateCameraFraming(document.body.clientWidth, document.body.clientHeight);
                    currentCameraZ = targetCameraZ;
                    camera.position.z = currentCameraZ;

                    mixer = new THREE.AnimationMixer(vrm.scene);
                    currentAnimationLoader = loader;
                    createNeonStool();

                    loader.load('./animations/idle_loop.vrma', (vrmaGltf) => {
                        const vrmAnimation = vrmaGltf.userData.vrmAnimations[0];
                        const clip = createVRMAnimationClip(vrmAnimation, vrm);
                        idleAction = mixer.clipAction(clip);
                        idleAction.play();
                        currentAction = idleAction;

                        // Keep startup light: talk is preloaded for TTS lips/body,
                        // all other gestures are lazy-loaded the first time an
                        // agent asks for them.
                        loadGestureAction('talk');
                    });
                },
                (progress) => {
                    if (window.PlawieBridge && progress.total > 0) {
                        window.PlawieBridge.postMessage('PROGRESS:' + (progress.loaded / progress.total));
                    }
                },
                (err) => {
                    console.error(err);
                    if (window.PlawieBridge) window.PlawieBridge.postMessage('ERROR: [JS] ' + err);
                }
            );
        };

        (function sendReady() {
            if (window.PlawieBridge) {
                window.PlawieBridge.postMessage('READY');
                window.PlawieBridge.postMessage(
                    'LOG: [JS] Renderer profile mobile=' + IS_MOBILE_RENDERER +
                    ' pixelRatio=' + MAX_RENDER_PIXEL_RATIO +
                    ' targetFps=' + Math.round(1000 / TARGET_FRAME_MS) +
                    ' deviceDpr=' + (window.devicePixelRatio || 1)
                );
            } else {
                setTimeout(sendReady, 50);
            }
        })();

        // ── Sparkle Manager (tap fireworks) ──────────────────────────────────
        class SparkleManager {
            constructor(scene) {
                this.scene = scene;
                this.maxParticles = IS_MOBILE_RENDERER ? 1200 : 5000;
                this.particles = [];
                this.geometry = new THREE.BufferGeometry();
                this.posBuffer = new Float32Array(this.maxParticles * 3);
                this.colBuffer = new Float32Array(this.maxParticles * 3);
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.posBuffer, 3));
                this.geometry.setAttribute('color', new THREE.BufferAttribute(this.colBuffer, 3));
                this.material = new THREE.PointsMaterial({
                    size: 0.08,
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true,
                });
                this.points = new THREE.Points(this.geometry, this.material);
                this.points.frustumCulled = false;
                this.scene.add(this.points);
            }

            spawn(screenX, screenY) {
                const vector = new THREE.Vector3(
                    (screenX / window.innerWidth) * 2 - 1,
                    -(screenY / window.innerHeight) * 2 + 1,
                    0.5
                );
                vector.unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.z / dir.z;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                for (let i = 0; i < 100; i++) {
                    const color = new THREE.Color().setHSL(Math.random(), 0.9, 0.6);
                    this.particles.push({
                        pos: pos.clone(),
                        vel: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.15,
                            (Math.random() - 0.2) * 0.18,
                            (Math.random() - 0.5) * 0.15
                        ),
                        color,
                        life: 1.0,
                        decay: 0.005 + Math.random() * 0.01,
                    });
                }
                if (this.particles.length > this.maxParticles) {
                    this.particles = this.particles.slice(-this.maxParticles);
                }
            }

            update(delta) {
                const dt = delta * 60;
                let activeCount = 0;
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.pos.add(p.vel.clone().multiplyScalar(dt));
                    p.vel.y -= 0.005 * dt;
                    p.life -= p.decay * dt;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    if (activeCount < this.maxParticles) {
                        const idx = activeCount * 3;
                        this.posBuffer[idx] = p.pos.x;
                        this.posBuffer[idx + 1] = p.pos.y;
                        this.posBuffer[idx + 2] = p.pos.z;
                        const alpha = Math.min(1.0, p.life * 2.5);
                        this.colBuffer[idx] = p.color.r * alpha;
                        this.colBuffer[idx + 1] = p.color.g * alpha;
                        this.colBuffer[idx + 2] = p.color.b * alpha;
                        activeCount++;
                    }
                }
                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.color.needsUpdate = true;
                this.geometry.setDrawRange(0, activeCount);
            }
        }
        window.SparkleManager = new SparkleManager(scene);

        const clock = new THREE.Clock();

        // ── Public API called by Flutter ──────────────────────────────────────

        window.setSpeechIntensity = (intensity) => {
            const wasSpeaking = isSpeaking;
            speechIntensity = intensity;
            isSpeaking = intensity > 0.1;

            // Auto talk gesture: start when TTS begins, stop when TTS ends.
            // Only acts when no explicit (non-talk) gesture is in progress.
            if (isSpeaking && !wasSpeaking) {
                const talkAction = gestures['talk'];
                if (talkAction && idleAction && gestureMode !== 'subtle') {
                    const onlyIdle = (currentAction === idleAction || !currentAction);
                    if (onlyIdle && !talkGestureActive) {
                        talkGestureActive = true;
                        talkAction.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).fadeIn(0.3).play();
                        if (currentAction && currentAction !== talkAction) currentAction.fadeOut(0.3);
                        currentAction = talkAction;
                    }
                }
                // Dance mode: immediately play dance loop
                if (gestureMode === 'dance') {
                    const danceAction = gestures['dance'] || gestures['spin'];
                    if (danceAction) window.playGesture('dance');
                }
            }

            if (!isSpeaking && wasSpeaking && talkGestureActive) {
                _returnToIdle(0.5);
            }
        };

        window.setThinking = (thinking) => { isThinking = thinking; };
        window.setCinematicMode = (active) => {};
        window.setGlowIntensity = (intensity) => {};

        let dynamicPip = false;
        window.setPipMode = (active) => {
            dynamicPip = active;
            updateCameraFraming(document.body.clientWidth, document.body.clientHeight);
        };

        // Called by agent to set gesture expression style.
        // Dart side: VrmAvatarWidget.gestureMode → didUpdateWidget → runJavaScript
        window.setGestureMode = (mode) => {
            gestureMode = mode;
            nextRandomGestureTime = -1;
            if (mode === 'dance' && isSpeaking) {
                window.playGesture('dance');
            } else if (mode === 'expressive') {
                // Reset timer so first expressive gesture fires in 3-5 s
                nextRandomGestureTime = clock.elapsedTime + 3 + Math.random() * 2;
            }
        };

        // Helper: smooth return to idle_loop
        function _returnToIdle(fadeIn = 0.5) {
            talkGestureActive = false;
            if (!idleAction || !currentAction) return;
            if (currentAction === idleAction) return;
            currentAction.fadeOut(fadeIn);
            idleAction.reset().fadeIn(fadeIn).play();
            currentAction = idleAction;
        }

        // ── Gesture playback with proper state machine ────────────────────────
        // Emotion → expression mapping (unchanged behaviour)
        const GESTURE_EMOTIONS = {
            greeting: 'happy', cute: 'happy', dance: 'happy',
            fight: 'angry', powerful: 'angry', shoot: 'angry',
            ready: 'relaxed', pose: 'relaxed', elegant: 'relaxed',
        };

        window.playGesture = (name) => {
            window.playCompositeGesture(name);
        };

        function normalizeGestureName(input) {
            return String(input || '')
                .toLowerCase()
                .replace('assets/vrm/', '')
                .replace('animations/', '')
                .replace('gesture_', '')
                .replace('.vrma', '')
                .replace(/^limbs\//, '')
                .replaceAll('_', ' ')
                .trim();
        }

        function registerGestureAction(alias, path, gltf) {
            if (!currentVrm || !mixer) return null;
            const anim = gltf.userData.vrmAnimations[0];
            const clip = createVRMAnimationClip(anim, currentVrm);
            const action = mixer.clipAction(clip);
            const isTalk = alias === 'talk' || alias === 'gesture_talk' || path.includes('gesture_talk');
            if (isTalk) {
                action.setLoop(THREE.LoopRepeat, Infinity);
            } else {
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
            }
            gestures[alias] = action;
            gestures[path.toLowerCase()] = action;
            gestures[path.split('/').pop().replace('.vrma', '').toLowerCase().replaceAll('_', ' ')] = action;
            if (path.includes('/gesture_')) {
                const shortName = path.split('/').pop().replace('.vrma', '').replace('gesture_', '');
                gestures[shortName] = action;
            }
            if (path.includes('dance_picatrix')) gestures['dance'] = action;
            return action;
        }

        function loadGestureAction(inputName) {
            const key = normalizeGestureName(inputName);
            const existing = gestures[key] || gestures['gesture_' + key];
            if (existing) return Promise.resolve(existing);
            if (!currentAnimationLoader || !currentVrm || !mixer) return Promise.resolve(null);

            const path = GESTURE_FILE_MAP[key] || GESTURE_FILE_MAP['gesture_' + key];
            if (!path) return Promise.resolve(null);
            if (pendingGestureLoads[key]) return pendingGestureLoads[key];

            pendingGestureLoads[key] = new Promise(resolve => {
                currentAnimationLoader.load(`./${path}`, (gltf) => {
                    const action = registerGestureAction(key, path, gltf);
                    if (window.PlawieBridge) {
                        window.PlawieBridge.postMessage('LOG: [JS] Gesture loaded on demand: ' + key);
                    }
                    resolve(action);
                }, undefined, (err) => {
                    if (window.PlawieBridge) {
                        window.PlawieBridge.postMessage('WARN: [JS] gesture failed ' + key + ': ' + err);
                    }
                    resolve(null);
                });
            }).finally(() => {
                delete pendingGestureLoads[key];
            });
            return pendingGestureLoads[key];
        }

        window.playCompositeGesture = async (baseClipName, layerClipNames = [], options = {}) => {
            const candidates = [baseClipName, ...(Array.isArray(layerClipNames) ? layerClipNames : [])]
                .map(normalizeGestureName)
                .filter(Boolean);
            const n = candidates.find(name =>
                gestures[name] ||
                GESTURE_FILE_MAP[name] ||
                GESTURE_FILE_MAP['gesture_' + name]) || candidates[0] || 'ready';
            targetEmotion = GESTURE_EMOTIONS[n] || 'neutral';

            // Auto-stool logic
            const isSitting = n.includes('squat') || n.includes('sit');
            if (neonStool) {
                neonStool.visible = isSitting;
                if (isSitting && currentVrm) {
                    neonStool.position.set(
                        currentVrm.scene.position.x,
                        currentVrm.scene.position.y - 0.05,
                        currentVrm.scene.position.z - 0.95
                    );
                    neonStool.rotation.y = currentVrm.scene.rotation.y;
                }
            }

            if (n === 'idle') { _returnToIdle(0.5); return; }

            const action = await loadGestureAction(n);
            if (!action || !currentVrm || !idleAction) return;
            if (currentAction === action && action.isRunning()) return;

            if (currentAction && currentAction !== action) currentAction.fadeOut(0.3);

            if (n === 'talk') {
                talkGestureActive = true;
                action.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).fadeIn(0.3).play();
                currentAction = action;
            } else {
                talkGestureActive = false;
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
                action.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).fadeIn(0.3).play();
                currentAction = action;

                const duration = action.getClip().duration;
                const returnDelay = Math.max((duration * 1000) - 350, 100);
                setTimeout(() => {
                    if (currentAction !== action) return;
                    if (isSpeaking && gestures['talk'] && gestureMode !== 'subtle') {
                        talkGestureActive = true;
                        action.fadeOut(0.4);
                        gestures['talk'].reset().setEffectiveWeight(1).setEffectiveTimeScale(1).fadeIn(0.4).play();
                        currentAction = gestures['talk'];
                    } else {
                        _returnToIdle(0.5);
                    }
                }, returnDelay);
            }
        };

        // ── Camera framing ────────────────────────────────────────────────────
        let avatarMetrics = { height: 1.8, width: 0.8, centerX: 0.0, headY: 1.6 };
        let userZoomOffset = 0;
        let initialPinchDistance = 0;

        function updateCameraFraming(containerWidth, containerHeight) {
            if (!containerWidth || !containerHeight) return;
            camera.aspect = containerWidth / containerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(containerWidth, containerHeight, false);

            const urlParams = new URLSearchParams(window.location.search);
            const isOverlay = urlParams.get('overlay') === 'true';
            const isPip = (urlParams.get('pip') === 'true') || dynamicPip;

            if (isPip) {
                const PIP_MARGIN = 1;
                const halfFov = (camera.fov * Math.PI) / 360;
                const tanHalf = Math.tan(halfFov);
                const pipDist = (avatarMetrics.height * PIP_MARGIN) / (2 * tanHalf);
                targetCameraZ = pipDist;
                const lookY = avatarMetrics.height * 0.5;
                camera.position.set(0, lookY, targetCameraZ);
                camera.lookAt(0, lookY, 0);
                return;
            }

            const ZOOM_FACTOR = isOverlay ? 2.5 : 1.25; // Slightly wider to fit full body
            const PAN_Y_OFFSET = isOverlay ? -0.5 : 0.15; // Positive looks higher, pushing model down
            const tanFov = Math.tan((camera.fov * Math.PI) / 360);
            
            // For a model standing at Y=0 with height H, its center is at H/2.
            const modelCenterY = avatarMetrics.height / 2;
            
            let distHeight = (avatarMetrics.height / (2 * tanFov)) / ZOOM_FACTOR;
            let distWidth = 0;
            if (camera.aspect < 0.6) {
                distWidth = (avatarMetrics.width / (2 * tanFov * camera.aspect)) / ZOOM_FACTOR;
            }
            
            targetCameraZ = Math.max(distHeight, distWidth) + userZoomOffset;
            
            // Position camera to look at the center of the model, but shifted by PAN_Y_OFFSET
            // Looking ABOVE the center pushes the model DOWN.
            const frameCenterY = modelCenterY + PAN_Y_OFFSET;
            const cameraY = frameCenterY + 0.05; // Maintain a slight downward tilt
            
            camera.position.set(avatarMetrics.centerX, cameraY, targetCameraZ);
            camera.lookAt(avatarMetrics.centerX, frameCenterY, 0);
        }

        let lastHeight = 0;
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const w = entry.contentRect.width;
                const h = entry.contentRect.height;
                if (Math.abs(h - lastHeight) > 100 || lastHeight === 0) {
                    updateCameraFraming(w, h);
                    lastHeight = h;
                }
            }
        });
        resizeObserver.observe(document.body);

        document.addEventListener('visibilitychange', () => {
            renderPaused = document.hidden;
            clock.getDelta(); // discard accumulated delta after background pauses
        });

        window.setRenderPaused = (paused) => {
            renderPaused = !!paused;
            clock.getDelta();
        };

        window.disposePlawieAvatar = () => {
            rendererDisposed = true;
            renderPaused = true;
            try { resizeObserver.disconnect(); } catch (_) {}
            disposeCurrentAvatar();
            try { renderer.dispose(); } catch (_) {}
            try {
                if (renderer.forceContextLoss) renderer.forceContextLoss();
            } catch (_) {}
        };

        window.addEventListener('pagehide', () => {
            if (window.disposePlawieAvatar) window.disposePlawieAvatar();
        });

        // ── Gaze tracking ─────────────────────────────────────────────────────
        let targetLookX = 0, targetLookY = 0;
        let currentLookX = 0, currentLookY = 0;
        let lastGazeTime = -100;

        window.setTapTarget = (screenX, screenY) => {
            targetLookX = Math.max(-0.8, Math.min(0.8, (screenX / window.innerWidth) * 2 - 1));
            targetLookY = Math.max(-0.8, Math.min(0.8, (screenY / window.innerHeight) * 2 - 1 + 0.35));
            lastGazeTime = clock.elapsedTime;
            if (window.SparkleManager) window.SparkleManager.spawn(screenX, screenY);
        };

        // ── Touch orbit + pinch zoom ──────────────────────────────────────────
        let orbitAngle = 0, orbitTarget = 0, lastOrbitTime = -100, isDragging = false, dragStartX = 0;
        const ORBIT_DRAG_SENSITIVITY = 0.01;

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true; dragStartX = e.touches[0].clientX; lastOrbitTime = clock.elapsedTime;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - dragStartX;
                dragStartX = e.touches[0].clientX;
                orbitTarget += dx * ORBIT_DRAG_SENSITIVITY;
                lastOrbitTime = clock.elapsedTime;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                userZoomOffset -= (dist - initialPinchDistance) * 0.01;
                userZoomOffset = Math.max(-1.5, Math.min(3.0, userZoomOffset));
                initialPinchDistance = dist;
                updateCameraFraming(document.body.clientWidth, document.body.clientHeight);
            }
        }, { passive: true });

        document.addEventListener('touchend', () => { isDragging = false; lastOrbitTime = clock.elapsedTime; }, { passive: true });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) return;
            targetLookX = Math.max(-0.6, Math.min(0.6, (e.clientX / window.innerWidth) * 2 - 1));
            targetLookY = Math.max(-0.6, Math.min(0.6, -(e.clientY / window.innerHeight) * 2 + 1));
            lastGazeTime = clock.elapsedTime;
        });

        // ── Main animation loop ───────────────────────────────────────────────
        function animate(timestamp = 0) {
            if (rendererDisposed) return;
            requestAnimationFrame(animate);
            const rawDelta = clock.getDelta();
            if (renderPaused || document.hidden) return;
            if (timestamp - lastRenderAt < TARGET_FRAME_MS) return;
            lastRenderAt = timestamp;
            const delta = Math.min(rawDelta, 0.05);
            const time = clock.elapsedTime;

            // Do not render an empty WebGL scene while the VRM is loading or
            // missing; Chromium logs this as a GPU warning and it can snowball
            // into serious graphics-memory pressure on Android.
            if (!currentVrm) return;

            if (mixer) mixer.update(delta);
            if (window.SparkleManager) window.SparkleManager.update(delta);

            // Camera lerp + orbit
            currentCameraZ = THREE.MathUtils.lerp(currentCameraZ, targetCameraZ, delta * 3.0);
            const urlParamsAnim = new URLSearchParams(window.location.search);
            const isOverlayAnim = urlParamsAnim.get('overlay') === 'true' || dynamicPip;
            if (!isOverlayAnim) {
                const timeSinceOrbit = time - lastOrbitTime;
                if (!isDragging && timeSinceOrbit > 4.0) {
                    orbitTarget = THREE.MathUtils.lerp(orbitTarget, 0, delta * 2.0);
                }
                orbitAngle = THREE.MathUtils.lerp(orbitAngle, orbitTarget, delta * 4.0);
                const camY = camera.position.y;
                camera.position.x = Math.sin(orbitAngle) * currentCameraZ + avatarMetrics.centerX;
                camera.position.z = Math.cos(orbitAngle) * currentCameraZ;
                camera.lookAt(avatarMetrics.centerX, avatarMetrics.centerY || camY, 0);
            } else {
                camera.position.z = currentCameraZ;
            }

            // ── Expressive mode: random interjection gestures while TTS is active ──
            if (gestureMode === 'expressive' && isSpeaking) {
                if (nextRandomGestureTime < 0) nextRandomGestureTime = time + 3 + Math.random() * 2;
                if (time >= nextRandomGestureTime && currentAction === gestures['talk']) {
                    const pool = EXPRESSIVE_GESTURES.filter(g => gestures[g]);
                    if (pool.length) window.playGesture(pool[Math.floor(Math.random() * pool.length)]);
                    nextRandomGestureTime = time + 5 + Math.random() * 6;
                }
            }

            // ── Procedural blend — suppressed while VRMA is active ─────────────
            // This is the fix for the "wrestling" artifact: when a VRMA clip is
            // playing, scaling procedural bone overrides to near-zero lets the VRMA
            // keyframes drive the skeleton without fighting each other.
            const isVrmaActive = currentAction && currentAction !== idleAction && currentAction.isRunning();
            const blendTarget = isVrmaActive ? 0.04 : 1.0;
            proceduralBlend = THREE.MathUtils.lerp(proceduralBlend, blendTarget, delta * 6.0);

            const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
            const upperChest = currentVrm.humanoid.getNormalizedBoneNode('upperChest');
            const neck = currentVrm.humanoid.getNormalizedBoneNode('neck');
            const head = currentVrm.humanoid.getNormalizedBoneNode('head');

            // Gaze: disable during active VRMA so it doesn't fight head animations
            const isGesturePlaying = isVrmaActive;
            const isGazing = (time - lastGazeTime) < 4.0 && !isGesturePlaying;
            const finalTargetX = isGazing ? targetLookX : 0;
            const finalTargetY = isGazing ? targetLookY : 0;
            currentLookX = THREE.MathUtils.lerp(currentLookX, finalTargetX, delta * 4.0);
            currentLookY = THREE.MathUtils.lerp(currentLookY, finalTargetY, delta * 4.0);

            const breathOsc = Math.sin(time * 1.5);
            const pb = proceduralBlend;

            if (upperChest) upperChest.rotation.x = breathOsc * 0.015 * pb;
            if (spine) {
                spine.rotation.z = Math.sin(time * 0.8) * 0.005 * pb;
                spine.rotation.y = currentLookX * 0.25 * pb;
            }
            if (head) {
                head.rotation.set(0, 0, 0);
                const saccadeX = Math.sin(time * 2.1) * Math.sin(time * 1.3 + 1.0);
                const saccadeY = Math.sin(time * 1.7) * Math.cos(time * 2.5 + 2.0);
                head.rotation.y = ((saccadeX * 0.02) + currentLookX * 0.6) * pb;
                head.rotation.x = ((saccadeY * 0.015) + currentLookY * 0.6) * pb;
                if (isThinking) {
                    head.rotation.z += Math.sin(time * 1.5) * 0.01 * pb;
                    head.rotation.x += Math.sin(time * 0.8) * 0.02 * pb;
                }
                head.rotation.y = Math.max(-0.8, Math.min(0.8, head.rotation.y));
                head.rotation.x = Math.max(-0.9, Math.min(0.9, head.rotation.x));
            }
            if (neck) {
                neck.rotation.set(0, 0, 0);
                const saccadeX = Math.sin(time * 2.1) * Math.sin(time * 1.3 + 1.0);
                neck.rotation.y = ((saccadeX * 0.01) + currentLookX * 0.15) * pb;
                neck.rotation.x = (currentLookY * 0.3) * pb;
            }

            // ── Smooth blinking (unaffected by proceduralBlend — always blinks) ──
            const blinkPeriod = Math.sin(time * 2.5) + Math.sin(time * 3.1);
            const targetBlink = blinkPeriod > 1.85 ? 1.0 : 0.0;
            const curBlink = currentVrm.expressionManager.getValue('blink') || 0;
            currentVrm.expressionManager.setValue('blink',
                THREE.MathUtils.lerp(curBlink, targetBlink, targetBlink > curBlink ? 0.6 : 0.2));

            // ── Emotion blending ───────────────────────────────────────────────
            const names = Object.keys(currentVrm.expressionManager.expressionMap);
            for (const emotion of ['happy', 'angry', 'sad', 'relaxed', 'surprised']) {
                if (names.includes(emotion)) {
                    const tgt = (emotion === targetEmotion && speechIntensity < 0.6) ? 0.6 : 0.0;
                    const cur = currentVrm.expressionManager.getValue(emotion) || 0;
                    currentVrm.expressionManager.setValue(emotion, THREE.MathUtils.lerp(cur, tgt, 0.05));
                }
            }

            // ── World-class viseme lip-sync ────────────────────────────────────
            // Syllable-rhythm driver: picks weighted English phonemes at ~5.5 syl/s
            // and applies a rise-hold-close envelope so the mouth opens and closes
            // naturally. Produces realistic co-articulation without audio analysis.
            const availableVisemes = VISEMES.filter(v => names.includes(v));
            if (speechIntensity > 0) {
                syllableTimer += delta;
                // Vary duration per syllable: 150–240 ms (natural speech irregularity)
                const durVariation = 0.85 + 0.30 * Math.sin(time * 3.7 + 1.2);
                const currentSylDur = syllableDur * durVariation;

                if (syllableTimer >= currentSylDur) {
                    syllableTimer = 0.0;
                    activeViseme = pickViseme(availableVisemes);
                    syllableAmp = 0.72 + 0.28 * Math.random();
                }

                // Envelope: rise (30%) → hold (40%) → close (30%)
                const phase = syllableTimer / Math.max(currentSylDur, 0.001);
                let envelope;
                if (phase < 0.3)      envelope = phase / 0.3;
                else if (phase < 0.7) envelope = 1.0;
                else                  envelope = 1.0 - (phase - 0.7) / 0.3;

                const effective = Math.min(1.0, speechIntensity * syllableAmp * envelope * 1.35);

                if (availableVisemes.length > 0) {
                    for (const v of availableVisemes) {
                        const tgt = (v === activeViseme) ? effective : 0;
                        const cur = currentVrm.expressionManager.getValue(v) || 0;
                        // Open faster than close (coarticulation feel)
                        const speed = tgt > cur ? 0.55 : 0.38;
                        currentVrm.expressionManager.setValue(v, THREE.MathUtils.lerp(cur, tgt, speed));
                    }
                } else if (names.includes('mouthOpen')) {
                    const cur = currentVrm.expressionManager.getValue('mouthOpen') || 0;
                    currentVrm.expressionManager.setValue('mouthOpen',
                        THREE.MathUtils.lerp(cur, effective, 0.5));
                }
            } else {
                // TTS stopped — close mouth
                syllableTimer = 0.0;
                for (const v of VISEMES) {
                    const cur = currentVrm.expressionManager.getValue(v) || 0;
                    if (cur > 0.001) currentVrm.expressionManager.setValue(v, THREE.MathUtils.lerp(cur, 0, 0.4));
                    else currentVrm.expressionManager.setValue(v, 0);
                }
                if (names.includes('mouthOpen')) {
                    const cur = currentVrm.expressionManager.getValue('mouthOpen') || 0;
                    if (cur > 0.001) currentVrm.expressionManager.setValue('mouthOpen', THREE.MathUtils.lerp(cur, 0, 0.4));
                    else currentVrm.expressionManager.setValue('mouthOpen', 0);
                }
            }

            // --- SYNC HEAD POSITION TO FLUTTER ---
            if (head && window.PlawieBridge) {
                const headWorldPos = new THREE.Vector3();
                head.getWorldPosition(headWorldPos);
                
                // Offset slightly above the head bone (near the crown/aura)
                headWorldPos.y += 0.22; 

                const vector = headWorldPos.project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

                if (time - lastHeadSync > 0.05) {
                    window.PlawieBridge.postMessage(`HEAD:${x}:${y}`);
                    lastHeadSync = time;
                }
            }

            // ── Ambient wind on spring bones ───────────────────────────────────
            if (currentVrm.springBoneManager) {
                const windX = Math.sin(time * 0.7) * 0.5 + Math.sin(time * 1.3) * 0.5;
                const windZ = Math.cos(time * 0.5) * 0.5 + Math.sin(time * 1.1) * 0.5;
                const windGust = (Math.sin(time * 0.3) + 1.0) * 0.5;
                const windForce = new THREE.Vector3(windX, 0, windZ).normalize();
                const gravityPower = 0.5 + windGust * 1.0;
                currentVrm.springBoneManager.joints.forEach(joint => {
                    joint.settings.gravityDir.set(windForce.x * 0.5, -1, windForce.z * 0.5).normalize();
                    joint.settings.gravityPower = gravityPower;
                });
            }
            currentVrm.update(delta);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
