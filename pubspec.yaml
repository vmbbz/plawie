name: clawa
description: Clawa Pocket AI Gateway for Android - standalone AI assistant.
publish_to: 'none'
version: 2.2.1+12

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.13
  dio: ^5.4.0
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  url_launcher: ^6.2.0
  web_socket_channel: ^3.0.0
  cryptography: ^2.7.0
  google_fonts: ^6.1.0
  flutter_markdown: ^0.7.3+1
  uuid: ^4.2.0
  geolocator: ^12.0.0
  camera: ^0.11.0
  flutter_svg: ^2.0.10

  # Crypto Payment Integration
  flutter_secure_storage: ^9.0.0
  web3dart: ^2.7.3
  logger: ^2.0.2+1
  
  # Phase 2: Advanced Features
  # Memory System
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Skills System
  yaml: ^3.1.2
  archive: ^4.0.9
  crypto: ^3.0.3
  image: ^4.8.0
  
  # Natural Scheduling
  cron: ^0.6.2
  
  # Android's SpeechRecognizer is the official client's resilient fallback when
  # a Gateway realtime Talk provider is not configured. Keep Gateway STT as a
  # compatibility path, but do not make it the only way to submit voice input.
  speech_to_text: ^7.3.0
  record: ^5.1.0
  
  # Base Chain (EVM) utilities
  decimal: ^2.3.3
  equatable: ^2.0.5
  audioplayers: ^6.6.0
  # On-device LLM inference via Android NDK — no PRoot, no Node.js
  fllama:
    path: ./fllama
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  # flutter_overlay_window: ^0.5.0

dependency_overrides:
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - README.md
    - assets/bionic_bypass.js
    - assets/resolv.conf
    - assets/ic_launcher.png
    - assets/app_icon_official.svg
    - assets/vrm/avatar_scene.html
    - assets/vrm/animations/
    - assets/vrm/animations/limbs/
    - assets/vrm/lib/
    - assets/vrm/utils/
    - assets/openclaw/android_bridge_tools.js
    - assets/openclaw/mobile_gateway_probe.js
    - assets/openclaw/mobile_skill_registry.js
    - assets/openclaw/python-debug-runtime/wheels/
    - assets/openclaw/whisper-runtime/lib/
    - assets/openclaw/agent-cli-pack/bin/
    - assets/openclaw/skills/battery.md
    - assets/openclaw/skills/vibrate.md
    - assets/openclaw/skills/sensors.md
    - assets/openclaw/skills/avatar_forge.md
    - assets/images/chat_main.jpg
    - assets/images/agent_tools.jpg
    - assets/images/local_llm.jpg
    - assets/images/chat_settings.jpg
    - assets/images/agent_fleet.jpg
    - assets/images/avatar_gemini.jpg
    - assets/images/webchat.jpg
    - assets/images/help_page.jpg
    - assets/images/dashboard.jpg
    - assets/images/gateway_logs.jpg
  fonts:
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.png"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): foreground has icon scaled to the 72dp safe zone
  # (288px centered in the 432px/xxxhdpi canvas) with transparent padding.
  # Generated via Python: icon at 66.7% of canvas = no launcher cropping.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/ic_launcher_foreground_padded.png"
